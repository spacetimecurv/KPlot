# config.example.ini
# -------------------
# Machine-specific PATHS for the KPlot system plotter.
#
#   cp config.example.ini config.ini     # then edit config.ini for your machine
#
# This is a plain config file (INI format), NOT a shell script — the values are
# parsed by plot_system.sh, never executed. config.ini is gitignored, so your
# local paths never get committed. Movie settings (FPS, stride) stay in
# plot_system.sh.
#
# Any key left blank is omitted, and kplot-system applies its own default.

[paths]
# Parent directory containing the output-XXXX restart-segment subdirectories,
# e.g.  <simpath>/output-0000/, <simpath>/output-0001/, ...
simpath = /home/no96soq/athenak/runs/PhysicsComparisonBHNS/MHD_M1/bin_2D
batchtools = false

# Parameters specific to the setup to be analyzed are
# set below.
# NOTE: not modifying these parameters will lead to
#       fallback to defaults.
[parameters]
# AthenaK job name prefixing all input/output files (input_block <job> name).
jobname=bhns

# Primitive-variable file prefix (before "_<plane>") for the density/
# temperature/s00 diagnostics, e.g. "mhd_w_bcc" (default) or "prim".
prim_prefix=mhd_w_bcc

# M1 radiation file prefix (before "_<var>_<plane>") for the E/N/abs/eta
# diagnostics, e.g. "rad_m1" (default).
rad_prefix=rad_m1

# Slice plane to render: 'xy'.
# Add a companion panel: 'xz', or 'yz' (else 'none').
plane=xy
companion=yz

# Set to "false" to hide the AMR grid.
show_grid=true

# Set to "false" (uncomment the second line) to hide tracker markers on 2-D plots
# SHOW_TRACKERS=true
show_trackers=false

# Set to "true" to overlay black-hole apparent-horizon circles on 2-D plots
# (needs <JOBNAME>.horizon_summary_k.txt and <JOBNAME>.co_k.txt tracker files)
show_horizon=true

# Set to "true" to skip frames whose PNG already exists in the Figs directory
skip_existing=true

# Tuple with the domain size in code units.
domain=(-80,80)

# Unit system for physical quantities: 'code', 'cgs', or 'ngs'  (default: cgs)
units=cgs

# Time display units for plot titles / time-series axes: 'Msun' or 'ms'
time_units=ms

# Set to "true" to delete the rendered *_frame_* PNGs after the movies are made
# (keeps the movies in <FIGPATH>/all_movies/, reclaims the frame disk space).
delete_frames=true

# Movie settings.
movie_fps = 24
movie_stride = 2

[sections]
# Name = vmin (target units), vmax (target units), colormap
history = ,,
#rho_max = ,,
trackers = ,,
#run_speed = ,,
density      = 1e6, 1e15, gist_earth
# temperature = 0, 20, viridis
s00          = 0.0, 0.6, cubehelix
# s00_avg = ,,
# conH = ,,
alpha        = 0.0, 1.0, ocean
# rad_E = ,,
# rad_N = ,,
# rad_N2 = ,,
# rad_abs = ,,
# rad_abs0 = ,,
# rad_eta0 = ,,
# rad_eta1 = ,,
avg_energy = 5.0, 15.0, viridis

# config.example.ini
# -------------------
# Machine-specific PATHS for the KPlot spherical-surface analysis driver.
#
#   cp config.example.ini config.ini     # then edit config.ini for your machine
#
# This is a plain config file (INI format), NOT a shell script — the values are
# parsed by run_analysis.sh, never executed. config.ini is gitignored, so your
# local paths never get committed. Only paths live here; all run settings
# (radius, workers, plot options) stay in run_analysis.sh.

[paths]
# Parent directory containing the output-XXXX restart-segment subdirectories,
# e.g.  <simpath>/output-0000/sph/, <simpath>/output-0001/sph/, ...
simpath = /leonardo_scratch/large/userexternal/osteppoh/basem1

# PyCompOSE HDF5 EOS table (must match the simulation EOS); required for ejecta.
eos_table = /leonardo_scratch/large/userexternal/osteppoh/basem1/EOS/SLy.h5

# Optional: extra directory prepended to PYTHONPATH for packages the module
# Python doesn't provide (e.g. a standalone vtk needed by athplot.load_sph_vtk).
#
# On Aurora the python module is a venv (no --user installs), so install into
# this directory with --target, then point pythonpath_extra at it:
#   module load python/3.12.12 py-pip
#   python3.12 -m pip install --target ~/.python-extra/py312 vtk h5py
#   pythonpath_extra = /home/<you>/.python-extra/py312
# Leave blank if KPlot and its dependencies are already importable.
pythonpath_extra =

# Parameters specific to the setup to be analyzed are 
# set below. 
# NOTE: not modifying these parameters will lead to 
#       fallback to defaults.
[parameters]
# AthenaK job name prefixing the sph VTK files (input_block <job> name).
jobname=bhns

# SPH extraction radius [M_sun] used for BOTH ejecta and neutrino analysis.
# Must have mhd/adm/z4c and rad_m1_E/F/N sph output at this radius.
radius=400.0

# GW extraction radius for the merger-time estimate (rpsi4_*_RRRR.txt).
wf_radius=400

# Neutrino plot x-axis: 0 = absolute time [ms]; 1 = t − t_merger [ms] (xlim left=0).
plot_from_merger=0

# How many ms post-merger to include in the 2D ejecta histogram.
t_post_ms=15.0

# Density floor used in the simulation [code units].
dfloor=1e-14

# Number of parallel workers, shared by the snapshot loop (ejecta/neutrino)
# and the Poynting-flux frame rendering (plot --poynting).
# Login node: keep ≤ 4.  Compute node (salloc/srun): set to the core count.
n_workers=8

# Whether to store the Ye histograms per iteration output.
per_iteration_out=False

# Plot options (plot --poynting / --ye-evo / --ye-theta-evo): 0 = off, 1 = on.
poynting=0
ye_evo=0
ye_theta_evo=0
# config.example.ini
# -------------------
# Machine-specific PATHS for the KPlot post-merger disk analysis script.
#   cp config.example.ini config.ini     # then edit config.ini for your machine

[paths]
# Directory containing the 3D binary files (mhd_w_bcc, adm, z4c_alpha,
# z4c_betax/y/z), e.g. <simpath>/bin_3D.
bindir = /leonardo_scratch/large/userexternal/osteppoh/basem1/bin_3D

# PyCompOSE HDF5 EOS table (must match the simulation EOS); required.
eos_table = /leonardo_scratch/large/userexternal/osteppoh/basem1/EOS/SLy.h5

# AthenaK checkout providing vis/python/bin_convert.py.
athenak_root = /leonardo_scratch/large/userexternal/osteppoh/AthenaK

# Optional: extra directory prepended to PYTHONPATH for packages the module
# Python doesn't provide.
#
# On Aurora the python module is a venv (no --user installs), so install into
# this directory with --target, then point pythonpath_extra at it:
#   module load python/3.12.12 py-pip
#   python3.12 -m pip install --target ~/.python-extra/py312 vtk h5py
#   pythonpath_extra = /home/<you>/.python-extra/py312
# Leave blank if KPlot and its dependencies are already importable.
pythonpath_extra =

# Parameters specific to the setup to be analyzed are
# set below.
# NOTE: not modifying these parameters will lead to
#       fallback to defaults.
[parameters]
# Drop the first x bins (during inspiral).
drop_first_bins = 3

# Path to the (merged) tracker file. If empty, 'center' has to be specified.
tracker =
center  =

# Path to the (merged) horizon file. If empty, 'r_exclude' has to be specified.
horizon   =
r_exclude =

# Density-dependent cuts [g/cm^3].
rho_cut     = 1.0e6
rho_keep    =
rho_remnant = 1.0e13

# Disk-specific parameters.
bound_criterion = bernoulli
r_disk_max      =
nbins           = 64
rmax            = 1000.0

# Number of worker processes for the snapshot loop.
n_workers = 8

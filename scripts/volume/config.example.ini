# config.example.ini
# -------------------
# Machine-specific PATHS for the KPlot disk analysis script.
#   cp config.example.ini config.ini     # then edit config.ini for your machine

[paths]
# One directory containing the 3D binary files.
bindir = /nfs04/data/gravtheo/oliver.steppohn.no96soq/AthenaK/BHNS/PhysicsComparison/BHNS_DD2_MBH-4.3_s0.75--MNS-1.6_s0.0_d40_360m_MHD_M1/bin_3D

# PyCompOSE HDF5 EOS table (must match the simulation EOS); required for disk.
eos_table = /nfs04/data/gravtheo/oliver.steppohn.no96soq/EOS/DD2/hdf5/DD2_NQT.h5

# Optional: extra directory prepended to PYTHONPATH for packages the module
# Python doesn't provide (e.g. a standalone vtk needed by athplot.load_sph_vtk).
#
# On Aurora the python module is a venv (no --user installs), so install into
# this directory with --target, then point pythonpath_extra at it:
#   module load python/3.12.12 py-pip
#   python3.12 -m pip install --target ~/.python-extra/py312 vtk h5py
#   pythonpath_extra = /home/<you>/.python-extra/py312
# Leave blank if KPlot and its dependencies are already importable.
pythonpath_extra =

# Parameters specific to the setup to be analyzed are
# set below.
# NOTE: not modifying these parameters will lead to
#       fallback to defaults.
[parameters]
# Drop the first x bins.
drop_first_bins = 3

# Path to the (merged) tracker file. If empty center has to be specified.
tracker = /nfs04/data/gravtheo/oliver.steppohn.no96soq/AthenaK/BHNS/PhysicsComparison/BHNS_DD2_MBH-4.3_s0.75--MNS-1.6_s0.0_d40_360m_MHD_M1/tracker/bhns.co_0.txt
center  =

# Path to the (merged) horizon file. If empty r_exclude has to be specified.
horizon   = /nfs04/data/gravtheo/oliver.steppohn.no96soq/AthenaK/BHNS/PhysicsComparison/BHNS_DD2_MBH-4.3_s0.75--MNS-1.6_s0.0_d40_360m_MHD_M1/horizon/bhns.horizon_summary_0.txt
r_exclude =

# Density-dependent cuts.
rho_cut     = 1.0e6
rho_keep    =
rho_remnant = 1.0e13

# Disk-specific parameters.
bound_criterion = bernoulli
r_disk_max      =
nbins           = 64
rmax            = 1000.0

# For spectra.
window_radius   = 8.0
target_dx       = 0.25

# Number of workers.
n_workers = 8

# Movie stuff.
movie_fps    = 8
movie_stride = 1